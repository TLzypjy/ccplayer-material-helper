name: build-tweak

on:
  push:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 unzip
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Set up Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -L "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolChain-x86_64.tar.xz" -o /tmp/toolchain.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain"
          "$THEOS/bin/install-sdk" latest

      - name: Install ldid
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /tmp/ldid
          chmod +x /tmp/ldid
          sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          ldid -V || true

      - name: Build dylib
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make FINALPACKAGE=1
          ls -la .theos/obj/CCMaterialGrid.dylib

      - name: Patch (arm64e subtype + objc auth entries)
        run: python3 patch_and_sign.py .theos/obj/CCMaterialGrid.dylib

      - name: Re-sign with ldid
        run: |
          ldid -S .theos/obj/CCMaterialGrid.dylib
          python3 - <<'EOF'
          import struct
          d = open('.theos/obj/CCMaterialGrid.dylib','rb').read()
          assert d[:4] == b'\xca\xfe\xba\xbe'
          nfat = struct.unpack_from('>I', d, 4)[0]
          for i in range(nfat):
              cpu, sub, foff, fsize, align = struct.unpack_from('>IIIII', d, 8 + i*20)
              o = foff + 32
              n = struct.unpack_from('<I', d, foff + 16)[0]
              sig = 0
              for k in range(n):
                  cmd, size = struct.unpack_from('<II', d, o)
                  if cmd == 0x1d:
                      sig = size
                  o += size
              print('slice %d sub=0x%x sig=%d' % (i, sub, sig))
              assert sig > 16, 'ldid did not sign slice %d' % i
          print('SIGN OK')
          EOF

      - name: Package deb
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: ccmaterial-deb
          path: packages/*.deb
          if-no-files-found: error
