name: build-tweak

on:
  push:
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 unzip
          sudo update-alternatives --set fakeroot /usr/bin/fakeroot-sysv || true

      - name: Set up Theos
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          curl -L "https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolChain-x86_64.tar.xz" -o /tmp/toolchain.tar.xz
          mkdir -p "$THEOS/toolchain"
          tar -xJf /tmp/toolchain.tar.xz -C "$THEOS/toolchain"
          "$THEOS/bin/install-sdk" latest

      - name: Install ldid
        run: |
          curl -L "https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_linux_x86_64" -o /tmp/ldid
          chmod +x /tmp/ldid
          sudo install -m 755 /tmp/ldid /usr/local/bin/ldid
          ldid -V || true

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make clean
          make FINALPACKAGE=1
          echo "=== Build output ==="
          find .theos -name "*.dylib" -o -name "*.deb" 2>/dev/null || true
          ls -la packages/ 2>/dev/null || echo "no packages/ dir"

      - name: Collect artifacts
        run: |
          mkdir -p upload
          find . -name "*.deb" -type f -exec cp {} upload/ \; 2>/dev/null || true
          find .theos -name "*.dylib" -type f -exec cp {} upload/ \; 2>/dev/null || true
          ls -la upload/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccmaterial-deb
          path: upload/*
